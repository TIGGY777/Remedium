.teethBlock{background:#fff;border-radius:24px;padding:18px;margin:12px 0}.teethRow{display:grid;grid-template-columns:repeat(8,1fr);gap:7px;margin:8px 0}.tooth{border:0;background:#f0f0f3;border-radius:13px;aspect-ratio:1;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#666}.tooth.ok{background:#eaf7f0;color:#18744d}.tooth.treat{background:#fff2e5;color:#c56b00}.tooth.crown{background:#eef4ff;color:#1769cf}.tooth.watch{background:#f2edff;color:#7247c7}.tooth.implant{background:#ececef;color:#333}.legend{display:flex;gap:10px;flex-wrap:wrap;margin-top:13px}.legend span{font-size:10px;color:#666}.legend i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:4px}

.paper{background:#fff;border-radius:20px;padding:25px 21px;box-shadow:0 4px 24px rgba(0,0,0,.05)}.paperHead{text-align:center;border-bottom:1px solid #ddd;padding-bottom:15px;margin-bottom:16px}.paperTable{width:100%;border-collapse:collapse;font-size:11px}.paperTable td,.paperTable th{border:1px solid #d8d8dc;padding:7px;text-align:left}

.chart{display:flex;height:116px;align-items:flex-end;gap:9px;padding:8px 0 20px}.bar{flex:1;background:#b8d8ff;border-radius:6px 6px 3px 3px;position:relative;min-height:7px}.bar span{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:9px;color:#888;margin-top:5px}.expenseRow{padding:14px 0;border-top:1px solid var(--line)}.expenseRow:first-child{border-top:0}

function rub(n){return Number(n).toLocaleString('ru-RU')+' ₽'} function show(id,b){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');if(b){document.querySelectorAll('.nav button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}scrollTo(0,0)}function render(h){show('detail');document.getElementById('detail').innerHTML=h}

function dentalMap(selected='16'){
 const top=['18','17','16','15','14','13','12','11','21','22','23','24','25','26','27','28'];
 const bot=['48','47','46','45','44','43','42','41','31','32','33','34','35','36','37','38'];
 const place=(arr,upper)=>arr.map((n,i)=>{
   const a=(upper ? 200+(140*i/(arr.length-1)) : 160-(140*i/(arr.length-1)))*Math.PI/180;
   const left=50+43*Math.cos(a);
   const topPos=50+39*Math.sin(a);
   const st=toothData(n)[0];
   return `<button data-tooth="${n}" class="toothNode ${st} ${n===selected?'selected':''}" style="left:${left.toFixed(2)}%;top:${topPos.toFixed(2)}%" onclick="selectTooth('${n}')">${n}</button>`;
 }).join('');
 render(`<button class="back" onclick="show('home')">‹ Главная</button>
 <div class="title">Зубная карта</div><div class="subtitle">Нажмите на зуб — карта останется на месте</div>

   <div class="dentalOval">

     <div class="archLabel bottom">Нижняя челюсть</div>
   </div>
   <div class="toothLegend">
     <span><i style="background:#67c590"></i>Здоров</span><span><i style="background:#f1a449"></i>Лечение</span><span><i style="background:#7caef0"></i>Коронка</span><span><i style="background:#9c7cdb"></i>Наблюдение</span><span><i style="background:#888"></i>Имплант</span>
   </div>
 </div>
 <div id="selectedToothInfo" class="toothInfoV13">${toothInfoHTML(selected)}</div>`);
}

function expenses(p){let starts={day:'2026-10-02',week:'2026-09-26',month:'2026-09-01',year:'2026-01-01',all:'2000-01-01'},rows=allTx().filter(x=>x[0]>=starts[p]),sum=rows.reduce((a,x)=>a+Number(x[5]),0),months={'Мар':0,'Июн':0,'Сен':0,'Окт':0};rows.forEach(x=>{let m=x[0].slice(5,7);if(m==='03')months['Мар']+=Number(x[5]);if(m==='06')months['Июн']+=Number(x[5]);if(m==='09')months['Сен']+=Number(x[5]);if(m==='10')months['Окт']+=Number(x[5])});let mx=Math.max(...Object.values(months),1);render(`<button class="back" onclick="show('profile')">‹ Профиль</button><div class="title">Расходы</div><div class="seg">${Object.entries({day:'День',week:'Неделя',month:'Месяц',year:'Год',all:'Всё время'}).map(([k,v])=>`<button class="${k===p?'on':''}" onclick="expenses('${k}')">${v}</button>`).join('')}</div><div class="card"><div class="muted">Итого за период</div><div class="money">${rub(sum)}</div>${p==='year'||p==='all'?`<div class="chart">${Object.entries(months).map(([m,v])=>`<div class="bar" style="height:${Math.max(7,v/mx*100)}%"><span>${m}</span></div>`).join('')}</div>`:''}</div><div class="section">Услуги за период</div>${rows.length?rows.map(x=>`<div class="card"><div class="row"><b>${x[1]}</b><b>${rub(x[5])}</b></div><h3>${x[4]}</h3><div class="muted">${x[2]} · ${x[3]}</div></div>`).join(''):'<div class="card empty">За этот период расходов нет.</div>'}<div class="card"><div class="muted small">Осталось по активному плану</div><div class="money" style="font-size:25px">${rub(PLAN.total-PLAN.paid)}</div></div>`)}


function dtTabs(){return `<div class="dtTabs"><button class="${DT_MODE==='overview'?'on':''}" onclick="dtSwitch('overview')">Общий вид</button><button class="${DT_MODE==='dental'?'on':''}" onclick="dtSwitch('dental')">Стоматология</button><button class="${DT_MODE==='face'?'on':''}" onclick="dtSwitch('face')">Лицо</button><button class="${DT_MODE==='body'?'on':''}" onclick="dtSwitch('body')">Тело</button></div>`}
function renderAvatar(){
 const root=document.getElementById('avatar');
 root.innerHTML=`<div class="dtTop"><div><div class="title">Мой аватар</div><div class="subtitle">Digital Twin · медицинская история в визуальном виде</div></div><span class="dtTopMark">LIVE PROFILE</span></div>${dtTabs()}<div id="dtScene"></div>`;
 dtRenderScene(false);
}
function dtSwitch(mode){if(mode===DT_MODE)return;DT_MODE=mode;document.querySelectorAll('.dtTabs button').forEach((b,i)=>b.classList.toggle('on',['overview','dental','face','body'][i]===mode));const s=document.getElementById('dtScene');if(s){s.style.opacity='.25';s.style.transform='translateY(5px)';setTimeout(()=>dtRenderScene(true),120)}}
function dtRenderScene(animated=true){const s=document.getElementById('dtScene');if(!s)return;s.style.opacity='1';s.style.transform='none';s.innerHTML=`<div class="dtModeScene">${DT_MODE==='overview'?dtOverview():DT_MODE==='dental'?dtDental():DT_MODE==='face'?dtFace():dtBody()}</div>`}

}
function dtTimelineSlider(){const pct=((DT_YEAR-2024)/2)*100;return `<div class="dtSliderWrap"><div class="row"><div><div class="small muted">Состояние аватара на дату</div><div class="dtTimeTitle">${DT_YEAR} год</div></div><span class="badge">${DT_EVENTS.filter(e=>e.year<=DT_YEAR).length} событий</span></div><input class="dtRange" style="--pct:${pct}%" type="range" min="2024" max="2026" step="1" value="${DT_YEAR}" oninput="dtSetYear(this.value,this)"><div class="dtYears"><span>2024</span><span>2025</span><span>2026</span></div></div>`}
function dtSetYear(v,input){DT_YEAR=Number(v);input.style.setProperty('--pct',((DT_YEAR-2024)/2*100)+'%');const y=input.closest('.dtSliderWrap').querySelector('.dtTimeTitle');if(y)y.textContent=DT_YEAR+' год';requestAnimationFrame(()=>{const s=document.getElementById('dtScene');if(s&&DT_MODE==='overview')dtRenderScene(false)})}

 <div class="dtZoneGrid"><button class="dtZoneCard" onclick="dtProcedure('Ринопластика')"><b><i class="dtZoneDot dtBlue"></i>Нос</b><span>Ринопластика · 15.06.2024</span></button><button class="dtZoneCard" onclick="dtOpenFaceZones()"><b><i class="dtZoneDot dtGold"></i>Скулы</b><span>Нет выполненных процедур</span></button><button class="dtZoneCard"><b><i class="dtZoneDot dtPurple"></i>Подбородок</b><span>Наблюдение</span></button><button class="dtZoneCard"><b><i class="dtZoneDot dtGreen"></i>Кожа</b><span>0 процедур</span></button></div>
 <div class="dtSection">Динамика изменений</div><div class="dtTimelineMini">${[1,2,3,4,5].map((n,i)=>`<img class="${i===4?'active':''}" src="${DT_ASSETS['profile'+n]}">`).join('')}</div>
 <button class="btn wide" style="margin-top:12px" onclick="dtOpenFaceZones()">Открыть зоны лица</button>`}

function dtDental(){return `<div class="dtSplit" id="dentalSplit" style="--split:50%;height:440px"><img src="${DT_ASSETS.dentalBefore}"><img class="after" src="${DT_ASSETS.dentalAfter}"><div class="dtSplitLine"></div><div class="dtSplitKnob">↔</div><div class="dtSplitLabels"><span>До</span><span>После</span></div><input class="dtSplitRange" type="range" min="5" max="95" value="50" oninput="dtSplitMove(this,'dentalSplit')"></div>

 <div class="dtSection">Состояние</div><div class="dtMetricGrid"><div class="dtMetric"><strong>2</strong><span>зуба в лечении</span></div><div class="dtMetric"><strong>1</strong><span>коронка</span></div><div class="dtMetric"><strong>43%</strong><span>план выполнен</span></div></div>
 <div class="dtPlanCard click" onclick="treatmentPlan()"><div class="dtPlanLine"><img class="dtPlanThumb" src="${DT_ASSETS.teeth}"><div class="grow"><b>Комплексное лечение</b><div class="muted small">3 из 5 этапов · следующий: зубы 16, 26</div><div class="progress" style="margin-top:7px"><span style="width:60%"></span></div></div><b>›</b></div></div>`}

function dtProcedure(title){const e=DT_EVENTS.find(x=>x.title===title)||DT_EVENTS[0];render(`<button class="back" onclick="show('avatar',document.querySelector('.avatarNav'))">‹ Аватар</button><div class="title">${e.title}</div><div class="subtitle">${e.kind} · ${e.date}</div><div class="card"><img src="${e.img}" style="width:100%;height:210px;object-fit:cover;border-radius:18px"><div class="item row"><span>Зона</span><b>${e.zone}</b></div><div class="item row"><span>Клиника</span><b>${e.clinic}</b></div><div class="item row"><span>Врач</span><b>${e.doctor}</b></div><div class="item row"><span>Стоимость</span><b>${rub(e.price)}</b></div><div class="item row"><span>Статус</span><span class="badge green">Выполнено</span></div></div><div class="card"><div class="section">Документы и результат</div><div class="item row"><span>Заключение врача</span><b>›</b></div><div class="item row"><span>Фото до / после</span><b>›</b></div><div class="item row"><span>Чек</span><b>›</b></div></div>`)}

 ob.classList.add('on');
 function draw(animate=true){
   let p=pages[idx];
   ob.innerHTML=`<div class="onboardBody obScene ${animate?'enter':''}">
     <div class="obBrand">Remedium</div>
     <div class="obVisual">
       <img class="obPhoto" src="${p.img}">
       <div class="obShade"></div>
       <div class="obFloat"><div class="mini">${p.mini}</div><b>${p.card}</b></div>
     </div>
     <div class="obTitle">${p.title}</div>
     <div class="obText">${p.text}</div>
     <div class="obDots">${pages.map((_,i)=>`<span class="${i===idx?'on':''}"></span>`).join('')}</div>
     <div style="margin-top:auto">
       <button class="btn" style="width:100%;background:#fff;color:#111" onclick="${idx<pages.length-1?'window.obNext()':'window.obDone()'}">${idx<pages.length-1?'Продолжить':'Начать'}</button>
       <button class="btn2" style="width:100%;margin-top:8px;background:transparent;color:#aaa" onclick="window.obDone()">Пропустить</button>
     </div>
   </div>`;
 }
 window.obNext=()=>{
   const scene=ob.querySelector('.obScene');
   if(scene)scene.classList.add('leave');
   setTimeout(()=>{idx++;draw(true)},210);
 };
 window.obDone=()=>{localStorage.setItem(key,'1');ob.classList.remove('on');renderHome()};
 draw(false);
}

renderHome();renderHistory();renderClinics();renderDocs();renderProfile();homeAppt();startOnboarding();
if('serviceWorker'in navigator)window.addEventListener('load',async()=>{try{let r=await navigator.serviceWorker.register('./sw.js?v=200');await r.update()}catch(e){}});

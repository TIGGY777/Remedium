/div>`;if(d[2]==='conclusion')body=`<div class="paper"><div class="paperHead"><div class="muted small">REMEDENT</div><h2>Заключение врача</h2><div class="small">18.09.2026</div></div><p><b>Пациент:</b> Тигран Саркисов</p><p><b>Врач:</b> Алексей Морозов</p><hr><p>Состояние полости рта стабильное. Проведён осмотр, актуализирован фотопротокол. Рекомендована профессиональная гигиена и контрольный осмотр через 6 месяцев.</p></div>`;let rec={receiptR:['Remedent','Профилактический осмотр + фотопротокол','4 500 ₽'],receiptW:['White Room','Профессиональная гигиена GBT','7 500 ₽'],receiptN:['NovaDent','Лечение кариеса · реставрация','32 000 ₽']}[d[2]];if(rec)body=`<div class="receipt"><div style="text-align:center"><b>${rec[0]}</b><div class="small">ЭЛЕКТРОННЫЙ ЧЕК</div></div><div class="line"><span>Дата</span><b>${d[1]}</b></div><div class="line"><span>Услуга</span><span style="text-align:right;max-width:58%">${rec[1]}</span></div><div class="line"><span>Оплачено</span><b>${rec[2]}</b></div><div class="line"><span>Оплата</span><span>Банковская карта</span></div><div class="line"><span>Статус</span><b>Оплачено ✓</b></div></div>`;render(`<button class="back" onclick="show('${back}')">‹ Назад</button><div class="title">${d[0]}</div><div class="subtitle">${d[1]}</div><div style="margin-top:12px">${body}</div>`)}

function expenses(p){let starts={day:'2026-10-02',week:'2026-09-26',month:'2026-09-01',year:'2026-01-01',all:'2000-01-01'},rows=allTx().filter(x=>x[0]>=starts[p]),sum=rows.reduce((a,x)=>a+Number(x[5]),0),months={'Мар':0,'Июн':0,'Сен':0,'Окт':0};rows.forEach(x=>{let m=x[0].slice(5,7);if(m==='03')months['Мар']+=Number(x[5]);if(m==='06')months['Июн']+=Number(x[5]);if(m==='09')months['Сен']+=Number(x[5]);if(m==='10')months['Окт']+=Number(x[5])});let mx=Math.max(...Object.values(months),1);render(`<button class="back" onclick="show('profile')">‹ Профиль</button><div class="title">Расходы</div><div class="seg">${Object.entries({day:'День',week:'Неделя',month:'Месяц',year:'Год',all:'Всё время'}).map(([k,v])=>`<button class="${k===p?'on':''}" onclick="expenses('${k}')">${v}</button>`).join('')}</div><div class="card"><div class="muted">Итого за период</div><div class="money">${rub(sum)}</div>${p==='year'||p==='all'?`<div class="chart">${Object.entries(months).map(([m,v])=>`<div class="bar" style="height:${Math.max(7,v/mx*100)}%"><span>${m}</span></div>`).join('')}</div>`:''}</div><div class="section">Услуги за период</div>${rows.length?rows.map(x=>`<div class="card"><div class="row"><b>${x[1]}</b><b>${rub(x[5])}</b></div><h3>${x[4]}</h3><div class="muted">${x[2]} · ${x[3]}</div></div>`).join(''):'<div class="card empty">За этот период расходов нет.</div>'}<div class="card"><div class="muted small">Осталось по активному плану</div><div class="money" style="font-size:25px">${rub(PLAN.total-PLAN.paid)}</div></div>`)}

function personal(){render(`<button class="back" onclick="show('profile')">‹ Профиль</button><div class="card"><div class="title">Личные данные</div><label class="muted small">ФИО</label><input id="pn" class="input" value="${PROFILE.name}"><label class="muted small">Телефон</label><input id="pp" class="input" value="${PROFILE.phone}"><label class="muted small">Дата рождения</label><input id="pb" class="input" value="${PROFILE.birth}"><button class="btn" style="width:100%" onclick="PROFILE={name:pn.value,phone:pp.value,birth:pb.value};saveMVP();toast('Сохранено')">Сохранить</button></div>`)}

 ob.classList.add('on');
 function draw(animate=true){
   let p=pages[idx];
   ob.innerHTML=`<div class="onboardBody obScene ${animate?'enter':''}">
     <div class="obBrand">Remedium</div>
     <div class="obVisual">
       <img class="obPhoto" src="${p.img}">
       <div class="obShade"></div>
       <div class="obFloat"><div class="mini">${p.mini}</div><b>${p.card}</b></div>
     </div>
     <div class="obTitle">${p.title}</div>
     <div class="obText">${p.text}</div>
     <div class="obDots">${pages.map((_,i)=>`<span class="${i===idx?'on':''}"></span>`).join('')}</div>
     <div style="margin-top:auto">
       <button class="btn" style="width:100%;background:#fff;color:#111" onclick="${idx<pages.length-1?'window.obNext()':'window.obDone()'}">${idx<pages.length-1?'Продолжить':'Начать'}</button>
       <button class="btn2" style="width:100%;margin-top:8px;background:transparent;color:#aaa" onclick="window.obDone()">Пропустить</button>
     </div>
   </div>`;
 }
 window.obNext=()=>{
   const scene=ob.querySelector('.obScene');
   if(scene)scene.classList.add('leave');
   setTimeout(()=>{idx++;draw(true)},210);
 };
 window.obDone=()=>{localStorage.setItem(key,'1');ob.classList.remove('on');renderHome()};
 draw(false);
}

renderHome();renderHistory();renderClinics();renderDocs();renderProfile();homeAppt();startOnboarding();

function expenses(p){let starts={day:'2026-10-02',week:'2026-09-26',month:'2026-09-01',year:'2026-01-01',all:'2000-01-01'},rows=allTx().filter(x=>x[0]>=starts[p]),sum=rows.reduce((a,x)=>a+Number(x[5]),0),months={'Мар':0,'Июн':0,'Сен':0,'Окт':0};rows.forEach(x=>{let m=x[0].slice(5,7);if(m==='03')months['Мар']+=Number(x[5]);if(m==='06')months['Июн']+=Number(x[5]);if(m==='09')months['Сен']+=Number(x[5]);if(m==='10')months['Окт']+=Number(x[5])});let mx=Math.max(...Object.values(months),1);render(`<button class="back" onclick="show('profile')">‹ Профиль</button><div class="title">Расходы</div><div class="seg">${Object.entries({day:'День',week:'Неделя',month:'Месяц',year:'Год',all:'Всё время'}).map(([k,v])=>`<button class="${k===p?'on':''}" onclick="expenses('${k}')">${v}</button>`).join('')}</div><div class="card"><div class="muted">Итого за период</div><div class="money">${rub(sum)}</div>${p==='year'||p==='all'?`<div class="chart">${Object.entries(months).map(([m,v])=>`<div class="bar" style="height:${Math.max(7,v/mx*100)}%"><span>${m}</span></div>`).join('')}</div>`:''}</div><div class="section">Услуги за период</div>${rows.length?rows.map(x=>`<div class="card"><div class="row"><b>${x[1]}</b><b>${rub(x[5])}</b></div><h3>${x[4]}</h3><div class="muted">${x[2]} · ${x[3]}</div></div>`).join(''):'<div class="card empty">За этот период расходов нет.</div>'}<div class="card"><div class="muted small">Осталось по активному плану</div><div class="money" style="font-size:25px">${rub(PLAN.total-PLAN.paid)}</div></div>`)}

function renderProfile(){document.getElementById('profile').innerHTML=`<div class="title">Профиль</div><div class="subtitle">${PROFILE.name}</div><div class="card"><div class="item row click" onclick="personal()"><div><b>Личные данные</b><div class="muted small">Имя, телефон, дата рождения</div></div><b>›</b></div><div class="item row click" onclick="dentalMap()"><div><b>Зубная карта</b><div class="muted small">История по каждому зубу</div></div><b>›</b></div><div class="item row click" onclick="expenses('year')"><div><b>Расходы</b><div class="muted small">Платежи и услуги</div></div><b>›</b></div><div class="item row click" onclick="show('docs')"><div><b>Медицинские документы</b><div class="muted small">Планы, заключения, чеки</div></div><b>›</b></div></div><div class="sectionTitle">Remedium</div><div class="card"><div class="item row click" onclick="clinicAdmin()"><div><b>Демо-кабинет клиники</b><div class="muted small">Как данные появляются у пациента</div></div><span class="adminTag">B2B demo</span></div><div class="item row click" onclick="startOnboarding(true)"><b>Повторить онбординг</b><b>›</b></div><div class="item row"><div><b>Версия</b><div class="muted small">Remedium MVP 1.0</div></div><span>1.0</span></div><div class="item row click" onclick="resetDemo()"><b style="color:var(--red)">Сбросить тестовые данные</b><b>›</b></div></div>`}
function personal(){render(`<button class="back" onclick="show('profile')">‹ Профиль</button><div class="card"><div class="title">Личные данные</div><label class="muted small">ФИО</label><input id="pn" class="input" value="${PROFILE.name}"><label class="muted small">Телефон</label><input id="pp" class="input" value="${PROFILE.phone}"><label class="muted small">Дата рождения</label><input id="pb" class="input" value="${PROFILE.birth}"><button class="btn" style="width:100%" onclick="PROFILE={name:pn.value,phone:pp.value,birth:pb.value};saveMVP();toast('Сохранено')">Сохранить</button></div>`)}
function searchAll(){render(`<button class="back" onclick="show('history')">‹ История</button><div class="title">Поиск</div><input id="sq" class="search" placeholder="Врач, клиника, процедура" oninput="searchResult(this.value)"><div id="sr"></div>`)}
function searchResult(q){q=q.toLowerCase().trim();let rows=allVisits().filter(v=>(v.clinic+' '+v.doctor+' '+v.service).toLowerCase().includes(q));document.getElementById('sr').innerHTML=q?(rows.length?rows.map(v=>`<div class="card click" onclick="visitById('${v.id}')"><b>${v.service}</b><div class="muted small">${v.clinic} · ${v.doctor}</div></div>`).join(''):'<div class="card empty">Ничего не найдено</div>'):''}
function clinicAdmin(){render(`<button class="back" onclick="show('profile')">‹ Профиль</button><div class="row"><div><div class="title">Кабинет клиники</div><div class="subtitle">Демонстрация обмена данными</div></div><span class="adminTag">B2B demo</span></div><div class="card"><div class="muted small">Сегодня · Remedent</div><h3>Тигран Саркисов</h3><div class="item row"><span>Врач</span><b>Алексей Морозов</b></div><div class="item row"><span>Приём</span><b>Контрольный осмотр</b></div><div class="item row"><span>Стоимость</span><b>3 500 ₽</b></div></div><div class="card"><div class="notice">После завершения визита у пациента автоматически появятся приём, заключение, чек и расход.</div><button class="btn" style="width:100%;margin-top:12px" onclick="completeDemoVisit()">Завершить визит</button></div>`)}
function completeDemoVisit(){if(EXTRA_VISITS.some(x=>x.id==='vx1')){toast('Визит уже добавлен');return}EXTRA_VISITS.unshift({id:'vx1',date:'2026-10-03',dateLabel:'3 октября 2026',clinic:'Remedent',doctor:'Алексей Морозов',service:'Контрольный осмотр',amount:3500,docs:['xd1','xd2']});EXTRA_DOCS.unshift({id:'xd1',date:'03.10.2026',kind:'conclusion',title:'Заключение контрольного осмотра'},{id:'xd2',date:'03.10.2026',kind:'receipt',title:'Чек Remedent №031026'});EXTRA_TX.unshift(['2026-10-03','3 октября 2026','Remedent','Алексей Морозов','Контрольный осмотр',3500]);saveMVP();toast('Данные появились у пациента');setTimeout(()=>show('home'),450)}
function resetDemo(){localStorage.removeItem(MVP_STORE);APPT={active:true,c:'r',doc:'Алексей Морозов',dir:'Терапия',service:'Первичный осмотр',price:'2500',date:'3 октября 2026',time:'15:30'};PROFILE={name:'Тигран Саркисов',phone:'+7 900 000-00-00',birth:'12.04.2001'};EXTRA_VISITS=[];EXTRA_DOCS=[];EXTRA_TX=[];saveMVP();toast('Тестовые данные сброшены');setTimeout(()=>show('home'),350)}

function startOnboarding(force=false){let key='remedium_mvp1_onboarded';if(!force&&localStorage.getItem(key))return;let idx=0,ob=document.getElementById('onboard'),pages=[['Вся история здоровья — в одном месте.','Посещения, планы лечения, документы и расходы остаются с пациентом.','История · Документы · Планы'],['Лечение становится понятным.','Remedium показывает, что уже сделано, что впереди и сколько это стоит.','План лечения · 43% выполнено'],['Запись без лишнего.','Клиника, врач, цена, свободное время — и полное управление записью.','Клиника → Врач → Время']];ob.classList.add('on');function draw(){let p=pages[idx];ob.innerHTML=`<div class="onboardBody"><div class="obBrand">Remedium</div><div class="obVisual"><div class="muted">Ваш медицинский профиль</div><div class="obMock">${p[2]}</div></div><div class="obTitle">${p[0]}</div><div class="obText">${p[1]}</div><div class="obDots">${pages.map((_,i)=>`<span class="${i===idx?'on':''}"></span>`).join('')}</div><div style="margin-top:auto"><button class="btn" style="width:100%;background:#fff;color:#111" onclick="${idx<2?'window.obNext()':'window.obDone()'}">${idx<2?'Продолжить':'Начать'}</button><button class="btn2" style="width:100%;margin-top:8px;background:transparent;color:#aaa" onclick="window.obDone()">Пропустить</button></div></div>`}window.obNext=()=>{idx++;draw()};window.obDone=()=>{localStorage.setItem(key,'1');ob.classList.remove('on');renderHome()};draw()}

renderHome();renderHistory();renderClinics();renderDocs();renderProfile();homeAppt();startOnboarding();
if('serviceWorker'in navigator)window.addEventListener('load',async()=>{try{let r=await navigator.serviceWorker.register('./sw.js?v=120');await r.update()}catch(e){}});
</script></body></html>

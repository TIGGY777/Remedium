<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><link rel="manifest" href="manifest.json"><title>Remedium</title><style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f7;color:#111;font-family:-apple-system,BlinkMacSystemFont,Arial}.app{max-width:520px;margin:auto;padding:18px 16px 90px}.head{font-size:28px;font-weight:750;margin-bottom:18px}.page{display:none}.page.on{display:block}.card{background:#fff;border-radius:20px;padding:17px;margin:11px 0}.muted{color:#777;font-size:13px}.title{font-size:20px;font-weight:700}.row{display:flex;justify-content:space-between;gap:10px}.btn{border:0;background:#111;color:#fff;padding:13px 16px;border-radius:14px;font-weight:650}.item{padding:14px 0;border-top:1px solid #eee;cursor:pointer}.item:first-child{border:0}.chip{display:inline-block;background:#eee;padding:8px 11px;border-radius:99px;margin:4px;font-size:12px}.chip.on{background:#111;color:#fff}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:flex;background:#fffffff2;border-top:1px solid #ddd;padding:12px 5px calc(12px + env(safe-area-inset-bottom))}.nav button{flex:1;border:0;background:none;font-size:11px}.back{border:0;background:none;font-weight:650;padding:4px 0 10px}.slot{display:inline-block;padding:10px;background:#eee;border-radius:12px;margin:4px}.input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px;margin:6px 0 12px}
</style></head><body><div class="app"><div class="head">Remedium</div>
<section id="home" class="page on"><div class="card"><div class="muted">Добрый вечер, Тигран</div><h1>Здоровье без лишнего.</h1><button class="btn" onclick="booking(1)">Записаться</button></div><div id="upcoming"></div><div class="card"><div class="row"><b>Расходы за год</b><b>68 900 ₽</b></div></div></section>
<section id="history" class="page"><div class="title">История</div><div id="hist"></div></section>
<section id="clinics" class="page"><div class="title">Клиники</div><div id="clist"></div></section>
<section id="docs" class="page"><div class="title">Документы</div><div id="dlist"></div></section>
<section id="profile" class="page"><div class="title">Профиль</div><div class="card"><div class="item" onclick="personal()"><b>Личные данные</b><div class="muted">Настройки профиля</div></div><div class="item" onclick="expenses('year')"><b>Расходы</b><div class="muted">День, неделя, месяц, год, всё время</div></div></div></section>
<section id="detail" class="page"></section></div>
<nav class="nav"><button onclick="show('home')">Главная</button><button onclick="show('history')">История</button><button onclick="show('clinics')">Клиники</button><button onclick="show('docs')">Документы</button><button onclick="show('profile')">Профиль</button></nav>
<script>
const C=[{id:'r',n:'Remedent',a:'Большая Дмитровка, 12',dirs:['Терапия','Гигиена','Ортопедия','Хирургия']},{id:'w',n:'White Room',a:'Пресненская наб., 8',dirs:['Терапия','Гигиена','Ортодонтия']},{id:'n',n:'NovaDent',a:'Остоженка, 25',dirs:['Терапия','Ортопедия','Хирургия','Ортодонтия']}];
const D=[['r','Алексей Морозов','Терапия'],['r','Елена Петрова','Гигиена'],['r','Михаил Саргсян','Ортопедия'],['r','Артём Белов','Хирургия'],['w','Мария Орлова','Терапия'],['w','Наталья Волкова','Гигиена'],['w','Иван Крылов','Ортодонтия'],['n','Михаил Саргсян','Терапия'],['n','Артём Беляев','Хирургия'],['n','София Андреева','Ортопедия'],['n','Анна Меликова','Ортодонтия']];
const S={r:[['Осмотр','2 500 ₽','Терапия'],['Лечение кариеса','12 000 ₽','Терапия'],['Гигиена GBT','7 500 ₽','Гигиена'],['Консультация хирурга','3 000 ₽','Хирургия'],['Консультация ортопеда','3 500 ₽','Ортопедия']],w:[['Осмотр','3 000 ₽','Терапия'],['Гигиена','8 000 ₽','Гигиена'],['Консультация ортодонта','4 000 ₽','Ортодонтия']],n:[['Осмотр','2 000 ₽','Терапия'],['Лечение кариеса','10 500 ₽','Терапия'],['Удаление зуба','9 000 ₽','Хирургия'],['Консультация ортопеда','3 500 ₽','Ортопедия'],['Консультация ортодонта','3 000 ₽','Ортодонтия']]};
const DOC=[['План лечения · Михаил Саргсян','02.03.2026','Диагностика, лечение кариеса 16/26, контроль.'],['План лечения · Алексей Морозов','18.09.2026','Гигиена, контрольные снимки, осмотр через 6 месяцев.'],['КЛКТ обеих челюстей','02.03.2026','3D-исследование сохранено в Remedium.'],['Фотопротокол · 12 фото','18.09.2026','Внутриротовой фотопротокол.'],['Заключение врача','18.09.2026','Состояние стабильное. Рекомендована профгигиена.'],['Чек Remedent','18.09.2026','4 500 ₽']];
const V=[['18 сентября 2026','Remedent','Алексей Морозов','Осмотр + фотопротокол','4 500 ₽'],['15 июня 2026','White Room','Елена Петрова','Профессиональная гигиена GBT','7 500 ₽'],['2 марта 2026','NovaDent','Михаил Саргсян','Лечение кариеса','32 000 ₽']];
function show(id){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));document.getElementById(id).classList.add('on');scrollTo(0,0)}
function detail(h){show('detail');detail.innerHTML=h}
function clinic(id,dir='Все'){let c=C.find(x=>x.id==id),ds=D.filter(x=>x[0]==id&&(dir=='Все'||x[2]==dir));window.detail(`<button class="back" onclick="show('clinics')">‹ Клиники</button><div class="card"><h1>${c.n}</h1><div class="muted">${c.a} · ★ 4.9</div><p>${['Все',...c.dirs].map(x=>`<span class="chip ${x==dir?'on':''}" onclick="clinic('${id}','${x}')">${x}</span>`).join('')}</p><div class="title">Врачи · ${dir}</div>${ds.map((x,i)=>`<div class="item" onclick="doctor('${id}','${x[1]}','${x[2]}')"><b>${x[1]}</b><div class="muted">${x[2]} · ★ 4.9 · ›</div></div>`).join('')}<div class="title" style="margin-top:16px">Отзывы</div><div class="item">★ 5.0 · Отличный сервис и понятный план лечения.</div></div>`)}
function doctor(c,n,d){window.detail(`<button class="back" onclick="clinic('${c}','${d}')">‹ Назад</button><div class="card"><h1>${n}</h1><div class="muted">${d} · ★ 4.9 · опыт 9+ лет</div><p>Отзывы пациентов и информация о враче.</p><button class="btn" onclick="B={c:'${c}',d:'${d}',doc:'${n}'};booking(4)">Записаться</button></div>`)}
function doc(i){let d=DOC[i];window.detail(`<button class="back" onclick="show('docs')">‹ Документы</button><div class="card"><div class="muted">${d[1]}</div><h1>${d[0]}</h1><p>${d[2]}</p><button class="btn" onclick="alert('Демо-просмотр документа')">Открыть</button></div>`)}
function visit(i){let v=V[i];window.detail(`<button class="back" onclick="show('history')">‹ История</button><div class="card"><div class="muted">${v[0]}</div><h1>${v[3]}</h1><p><b>${v[1]}</b> · ${v[2]}</p><b>${v[4]}</b><h3>Документы приёма</h3>${DOC.slice(2,6).map((d,j)=>`<div class="item" onclick="doc(${j+2})">${d[0]} <span class="muted">›</span></div>`).join('')}</div>`)}
function personal(){window.detail(`<button class="back" onclick="show('profile')">‹ Профиль</button><div class="card"><h2>Личные данные</h2><input class="input" value="Тигран Саркисов"><input class="input" value="+7 900 000-00-00"><input class="input" value="12.04.2001"><button class="btn" onclick="alert('Сохранено в демо')">Сохранить</button></div>`)}
function expenses(p){let X={day:'2 500',week:'7 500',month:'12 000',year:'68 900',all:'102 400'};window.detail(`<button class="back" onclick="show('profile')">‹ Профиль</button><h2>Расходы</h2><div>${Object.entries({day:'День',week:'Неделя',month:'Месяц',year:'Год',all:'Всё время'}).map(x=>`<span class="chip ${x[0]==p?'on':''}" onclick="expenses('${x[0]}')">${x[1]}</span>`).join('')}</div><div class="card"><div class="muted">За выбранный период</div><h1>${X[p]} ₽</h1><div class="item">Лечение <b style="float:right">32 000 ₽</b></div><div class="item">Гигиена <b style="float:right">7 500 ₽</b></div></div>`)}
let B={};function booking(s){if(s==1)window.detail(`<button class="back" onclick="show('home')">‹ Назад</button><h2>Выберите клинику</h2>${C.map(c=>`<div class="card" onclick="B.c='${c.id}';booking(2)"><b>${c.n}</b><div class="muted">${c.a}</div></div>`).join('')}`);
if(s==2){let c=C.find(x=>x.id==B.c);window.detail(`<button class="back" onclick="booking(1)">‹ Назад</button><h2>Направление</h2><div class="card">${c.dirs.map(d=>`<span class="chip" onclick="B.d='${d}';booking(3)">${d}</span>`).join('')}</div>`)}
if(s==3){let ds=D.filter(x=>x[0]==B.c&&x[2]==B.d);window.detail(`<button class="back" onclick="booking(2)">‹ Назад</button><h2>Врач</h2><div class="card">${ds.map(x=>`<div class="item" onclick="B.doc='${x[1]}';booking(4)"><b>${x[1]}</b><div class="muted">${x[2]}</div></div>`).join('')}</div>`)}
if(s==4){let ss=S[B.c].filter(x=>x[2]==B.d);window.detail(`<button class="back" onclick="booking(3)">‹ Назад</button><h2>Услуга</h2><div class="card">${ss.map(x=>`<div class="item" onclick="B.service='${x[0]}';B.price='${x[1]}';booking(5)"><b>${x[0]}</b><b style="float:right">${x[1]}</b></div>`).join('')}</div>`)}
if(s==5)window.detail(`<button class="back" onclick="booking(4)">‹ Назад</button><h2>Свободное время</h2><div class="card">${['10:00','11:30','13:00','15:30','17:00','18:30'].map(x=>`<span class="slot" onclick="B.time='${x}';booking(6)">${x}</span>`).join('')}</div>`);
if(s==6){let c=C.find(x=>x.id==B.c);window.detail(`<button class="back" onclick="booking(5)">‹ Назад</button><div class="card"><h2>Подтверждение</h2><p>${c.n}<br>${B.doc}<br>${B.service} · ${B.price}<br>${B.time}</p><button class="btn" onclick="confirmBook()">Подтвердить запись</button></div>`)}}
function confirmBook(){let c=C.find(x=>x.id==B.c);upcoming.innerHTML=`<div class="card"><div class="muted">Ближайшая запись</div><b>${B.service}</b><div>${c.n} · ${B.doc} · ${B.time}</div></div>`;window.detail(`<div class="card"><h1>✓ Запись подтверждена</h1><p>${c.n}<br>${B.doc}<br>${B.service} · ${B.time}</p><button class="btn" onclick="show('home')">На главную</button></div>`)}
clist.innerHTML=C.map(c=>`<div class="card" onclick="clinic('${c.id}')"><h3>${c.n}</h3><div class="muted">${c.a} · ★ 4.9</div></div>`).join('');
hist.innerHTML=V.map((v,i)=>`<div class="card" onclick="visit(${i})"><div class="row"><b>${v[0]}</b><b>${v[4]}</b></div><div>${v[3]}</div><div class="muted">${v[1]} · ${v[2]}</div></div>`).join('');
dlist.innerHTML=DOC.map((d,i)=>`<div class="card" onclick="doc(${i})"><b>${d[0]}</b><div class="muted">${d[1]} · ›</div></div>`).join('');
</script></body></html>
